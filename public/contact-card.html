      align-items: center;

    }

    .card {
      width: 320px;
      padding: 30px;
      border-radius: 24px;
      background: #161616;
      border: 1px solid #2a2a2a;
      text-align: center;
      box-shadow: 0 0 30px rgba(232, 255, 71, 0.08);

    .card h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    .card p {
      color: #999;
      margin-bottom: 25px;
    }

    .btn {
      display: block;
      margin-top: 15px;
      padding: 14px;
      border-radius: 14px;
      background: #98a63d;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

</head>
